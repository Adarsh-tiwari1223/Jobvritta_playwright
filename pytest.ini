[pytest]
testpaths = tests
addopts = --browser chromium --html=reports/report.html --self-contained-html -v -s --log-cli-level=INFO
markers =
    smoke: smoke tests for critical functionality
    regression: regression tests for bug prevention
    sanity: sanity tests for basic functionality
    integration: integration tests for module interactions
    e2e: end-to-end tests for complete workflows
    api: API testing
    ui: UI testing
    database: database related tests
    security: security testing
    performance: performance testing
    slow: tests that take longer to execute
    fast: quick tests for rapid feedback
    critical: critical path tests
    admin: admin role specific tests
    user: user role specific tests
    employee: employee role specific tests
    hr: HR role specific tests
    recruiter: recruiter role specific tests
    login: login functionality tests
    dashboard: dashboard functionality tests
    profile: profile management tests
    reports: reporting functionality tests